manifest_version: 2

version:
  name:    v1_0
  label:   "1.0-dev"
  comment: "LocID enrichment — DEV build (provider sandbox only, not published to Marketplace)"

artifacts:
  # Dev setup script: runs prod setup.sql first, then adds DEV-only proc
  setup_script: setup_dev.sql
  readme: README.md
  default_streamlit: APP_SCHEMA.LOCID_APP

# Same privileges as prod manifest
privileges:
  - CREATE EXTERNAL ACCESS INTEGRATION:
      description: "Creates EAI for outbound HTTPS to central.locid.com for license validation and usage stats. No customer data is sent. Requires MANAGE APPLICATION SPECIFICATIONS privilege."

references:
  - ENCRYPT_INPUT_TABLE:
      label: "Input Table for Encrypt"
      description: "Table with ip_address + timestamp columns for Encrypt jobs. Read-only. Use a role owning this table or with SELECT WITH GRANT OPTION. Any database is valid."
      privileges:
        - SELECT
      object_type: TABLE
      multi_valued: false
      register_callback: APP_SCHEMA.register_single_callback

  - DECRYPT_INPUT_TABLE:
      label: "Input Table for Decrypt"
      description: "Table with TX_CLOC column for Decrypt jobs. Read-only. Use a role owning this table or with SELECT WITH GRANT OPTION. Any database is valid."
      privileges:
        - SELECT
      object_type: TABLE
      multi_valued: false
      register_callback: APP_SCHEMA.register_single_callback

configuration:
  log_level:   INFO
  trace_level: ALWAYS
